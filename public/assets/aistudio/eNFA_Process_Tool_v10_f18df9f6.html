<!DOCTYPE html>
<html lang="en" data-theme="slate"><head><meta name="ms-sp-authoring-source" content="agent"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>e-NFA | Purchase Proposal Approval System (v10)</title><meta name="theme-color" content="#0F2A4A">
<style>
:root{--navy:#0F2A4A;--navy2:#173B63;--blue:#2563EB;--blue2:#1D4ED8;--teal:#0E7C86;--inp:#FFFDF5;--inpb:#E9D8A6;--grn:#E7F6EC;--red:#FDECEC;--gry:#F4F6FA;--bd:#E2E8F0;--bd2:#CBD5E1;--tx:#0F172A;--tx2:#475569;--tx3:#64748B;--ok:#047857;--bad:#B91C1C;--warn:#B45309;--r:12px;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);--sh2:0 10px 30px rgba(15,23,42,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:13.5px;line-height:1.45;color:var(--tx);background:radial-gradient(1200px 400px at 80% -120px,#dbe7ff 0,transparent 60%),#F1F4F9;-webkit-font-smoothing:antialiased}
/* ---------- App bar ---------- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#0B2240 0%,#123A66 55%,#1B4F86 100%);color:#fff;padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(2,12,27,.25)}
header .logo{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#fff,#dbe7ff);color:var(--navy);font-weight:800;letter-spacing:.5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
header .brand{flex:1;min-width:220px}header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:11px;color:#BFD4F2;letter-spacing:.3px}
header .ctl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:4px 6px 4px 10px;border-radius:10px;font-size:11px;color:#CFE0F7}
header .ctl select{width:auto;min-width:150px;background:#fff;color:var(--tx);border:0;border-radius:7px;padding:5px 8px;font-size:12.5px;font-weight:600}
header .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#F59E0B;color:#1F2937;font-weight:800;font-size:11px}
/* ---------- Record bar ---------- */
.bar{max-width:1600px;margin:14px auto 0;padding:0 24px;display:block}
.recbar{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 22px;align-items:center}
.recbar .id{font-size:17px;font-weight:800;color:var(--navy2);letter-spacing:.2px}.recbar .id small{display:block;font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.3px}
.recbar .facts{display:flex;flex-wrap:wrap;gap:6px 22px}.fact span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:700}.fact b{font-size:13.5px;color:var(--tx);font-variant-numeric:tabular-nums}
.prog{min-width:210px}.prog .t{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);font-weight:600;margin-bottom:5px}
.prog .track{height:8px;border-radius:99px;background:#E8EEF7;overflow:hidden}.prog .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#10B981,#2563EB);transition:width .4s}
.nextact{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:#F0F6FF;border:1px dashed #A9C4F5;font-size:12.5px;color:#1E3A8A}
.nextact.mine{background:#FFF7E6;border-color:#F3C677;color:#7C4A03}.nextact b{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-weight:700;font-size:11px;letter-spacing:.3px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.Draft{background:#E8EEFF;color:#1E40AF}.Pending{background:#FEF3C7;color:#92400E}.Approved{background:#D1FAE5;color:#065F46}
.Returned,.Rejected{background:#FEE2E2;color:#991B1B}.Superseded{background:#E5E7EB;color:#374151}
/* ---------- Stepper ---------- */
.steps{max-width:1600px;margin:12px auto 0;padding:0 24px}
.stepper{display:flex;gap:0;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:6px;overflow-x:auto;scrollbar-width:thin}
.stp{position:relative;flex:1 1 0;min-width:118px;display:flex;gap:8px;align-items:center;border:0;background:transparent;padding:7px 9px;border-radius:9px;cursor:pointer;text-align:left;color:var(--tx2);font:inherit}
.stp:hover{background:#F3F6FB}.stp .dot{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:#EEF2F7;color:var(--tx3);border:2px solid #E2E8F0}
.stp .lb{display:flex;flex-direction:column;min-width:0}.stp .lb b{font-size:12px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stp .lb small{font-size:10px;color:var(--tx3);white-space:nowrap}
.stp.done .dot{background:#10B981;border-color:#10B981;color:#fff}.stp.cur{background:#EEF4FF}.stp.cur .dot{background:var(--blue);border-color:#BFD3FF;color:#fff;box-shadow:0 0 0 4px #DCE7FF}
.stp.cur .lb b{color:var(--blue2)}.stp.locked{opacity:.5;cursor:not-allowed}.stp.locked .dot{background:#F8FAFC}.stp .dot svg{width:12px;height:12px}
.stp+.stp:before{content:"";position:absolute;left:-1px;top:50%;width:1px;height:22px;transform:translateY(-50%);background:var(--bd)}
.util{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.util button{border:1px solid var(--bd);background:#fff;padding:4px 10px;border-radius:9px;font:inherit;font-weight:700;font-size:12px;color:var(--tx2);cursor:pointer;white-space:nowrap}.util button:hover{background:#F3F6FB}.util button.on{background:var(--navy2);color:#fff}
/* ---------- Content ---------- */
main{max-width:1600px;margin:12px auto 0;padding:0 24px 60px}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;margin-bottom:14px}.card.anim{animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
h2{color:var(--navy2);font-size:18px;font-weight:800;margin:0 0 4px;padding:0 0 10px;border-bottom:1px solid var(--bd);letter-spacing:.1px}
h3{color:var(--navy2);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h3:before{content:"";width:4px;height:14px;border-radius:3px;background:var(--blue)}
table{border-collapse:separate;border-spacing:0;width:100%;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin:6px 0 10px;background:#fff}
th{background:#F1F5FB;color:#334155;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:bottom}
th.dk{background:#E6EEFA;color:var(--navy2);text-transform:none;letter-spacing:0;font-size:11.5px}
td{border-bottom:1px solid #EEF2F7;padding:7px 8px;vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr:hover td,table tr:hover td{background-color:#FAFCFF}
td.l{background:#F8FAFC;font-weight:600;color:#334155;width:240px}td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.g{background:#ECFDF3!important;font-weight:700;color:#065F46}
input,select,textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--inpb);border-radius:7px;padding:6px 8px;background:var(--inp);color:#1E3A8A;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18);background:#fff}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}textarea{min-height:46px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#F8FAFC;color:#334155;border-color:#EDF1F6;cursor:default}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 14px}
.kpi{position:relative;border:1px solid var(--bd);border-radius:12px;padding:14px 14px 12px;background:linear-gradient(180deg,#fff,#FAFCFF);overflow:hidden}
.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.kpi b{display:block;font-size:22px;font-weight:800;color:var(--navy2);font-variant-numeric:tabular-nums;margin-top:3px}.kpi.s b{color:var(--ok)}.kpi.s:after{background:#10B981}
.kpi span{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:12.5px;font-family:inherit;box-shadow:0 1px 2px rgba(15,23,42,.12);transition:transform .05s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn.g{background:#059669}.btn.r{background:#DC2626}.btn.o{background:#D97706}.btn.w{background:#fff;color:var(--navy2);border-color:var(--bd2)}
.btn:disabled{background:#CBD5E1;color:#F8FAFC;border-color:transparent;cursor:not-allowed;box-shadow:none;filter:none}
header .btn.w{background:#fff;border:0}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.note{font-size:12px;color:var(--tx3);margin:6px 0}
.lock{display:flex;gap:8px;align-items:center;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600}
.lockok{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 16px}.flow div{background:#F8FAFC;border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-weight:700;font-size:12px;color:var(--tx2)}
.flow div.done{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}.flow div.done:before{content:"✓ "}.flow div.cur{background:#EEF4FF;border-color:#93B4F6;color:var(--blue2);box-shadow:0 0 0 3px #E0EAFF}.flow i{color:#94A3B8;font-style:normal}
.rec{background:linear-gradient(100deg,#F0F6FF,#F8FBFF);border:1px solid #D6E4FB;border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;margin:10px 0}
.stage-submit{position:sticky;bottom:12px;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--bd);box-shadow:var(--sh2)}
.stage-submit .txt{flex:1;min-width:240px}.stage-submit .txt b{display:block;color:var(--navy2)}.stage-submit .txt span{font-size:12px;color:var(--tx3)}
.stage-submit .st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#ECFDF5;color:#065F46}.stage-submit .st.no{background:#F1F5F9;color:var(--tx2)}
.tech-card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tech-meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:10px 0}
.tech-meta label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.tech-checks th{text-align:left}.tech-checks td:first-child{width:48%;font-weight:600}.tech-checks td:nth-child(2){width:150px}.tech-checks textarea{min-height:34px}
.tech-status{margin-top:8px;font-size:12px;font-weight:700}
@media(max-width:700px){.tech-meta{grid-template-columns:1fr}.tech-checks{min-width:520px}}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-weight:800;font-size:14px;border-radius:6px;padding:2px 6px}.x:hover{background:#FEE2E2}
/* ---------- Toasts ---------- */
#toasts{position:fixed;right:20px;top:72px;pointer-events:none;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:440px}
.toast{pointer-events:auto;background:#0F172A;color:#F8FAFC;border-radius:12px;padding:12px 14px 12px 14px;box-shadow:var(--sh2);font-size:13px;white-space:pre-line;display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease}
.toast.err{background:#7F1D1D}.toast.ok{background:#064E3B}.toast .ic{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:rgba(255,255,255,.18)}.toast button{margin-left:auto;background:none;border:0;color:#CBD5E1;cursor:pointer;font-size:15px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.recbar{grid-template-columns:1fr}.steps{flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){header{position:static;padding:10px 12px}.nextact{flex-wrap:wrap}header .ctl{flex:1 1 100%}header .ctl select{min-width:0;flex:1}header .brand{min-width:0}.prog{min-width:0}.bar,.steps,main{padding-left:10px;padding-right:10px}.grid2{grid-template-columns:1fr}.card{padding:14px}td.l{width:auto}}
@media(max-width:900px){.card table{display:block;overflow-x:auto;max-width:100%}.nfa-hero{flex-direction:column;align-items:flex-start}}
.print-only{display:none}
@media print{.card.anim{animation:none!important}textarea{display:none!important}.print-only{display:block;white-space:pre-wrap;font-size:7.5px;line-height:1.35;color:#1f2937}.nfa-document input,.nfa-document select{font-size:7.5px!important;min-height:0!important}.stage-submit{display:none!important}}

.lpp-up{color:#B91C1C;font-weight:800}.lpp-dn{color:#047857;font-weight:800}.lpp-na{color:#94A3B8}
.lpp-wrap{overflow-x:auto;margin:4px 0 10px}
table.lpp-c{table-layout:fixed;font-size:11.5px;line-height:1.25;margin:0;min-width:1080px}
table.lpp-c th{padding:5px 5px;font-size:9.5px;letter-spacing:.3px;line-height:1.2;vertical-align:bottom}
table.lpp-c td{padding:3px 5px;vertical-align:top}
table.lpp-c th.r,table.lpp-c td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}table.lpp-c td.c{text-align:center;font-size:13px}
table.lpp-c input,table.lpp-c select,table.lpp-c textarea{font-size:11.5px;padding:2px 5px;border-radius:5px;height:24px;min-height:24px}
table.lpp-c textarea{height:auto;min-height:24px;resize:vertical;line-height:1.3}
table.lpp-c small{color:var(--tx3);font-size:10px}
table.lpp-c .lpp-d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-size:10.5px}
table.lpp-c .lpp-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.lpp-c tr.e td{background:#FFF7F7}table.lpp-c tr.w td{background:#FFFBEB}table.lpp-c tr.t td{background:#F1F5FB;border-top:1px solid var(--bd2)}
table.lpp-c .lpp-badge{padding:1px 6px;font-size:10px}
.lpp-err{border-color:#DC2626!important;background:#FEF2F2!important;box-shadow:0 0 0 2px rgba(220,38,38,.12)}
.lpp-val{border-radius:8px;padding:6px 10px;margin:4px 0 6px;font-size:12px;border:1px solid}.lpp-val.ok{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}.lpp-val.bad{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.lpp-val ul{margin:4px 0 0;padding-left:18px}.lpp-val li{margin:1px 0}.lpp-w{color:#B45309;font-weight:800}.lpp-cnt{color:#B91C1C!important;font-weight:700}
@media print{table.lpp-c{min-width:0;font-size:7px}table.lpp-c th{font-size:6.5px;padding:3px}table.lpp-c td{padding:2px 3px}table.lpp-c .lpp-d{white-space:normal}table.lpp-c textarea{display:none!important}}
.lpp-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800}.lpp-badge.up{background:#FEE2E2;color:#991B1B}.lpp-badge.dn{background:#D1FAE5;color:#065F46}.lpp-badge.eq{background:#E5E7EB;color:#374151}
/* ================= NFA PROFESSIONAL PRINT LAYOUT ================= */
.nfa-document{background:#fff;border:0;border-radius:12px;padding:2px 0 0;color:#1d2939}
.nfa-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px;margin:0 0 18px;border-radius:10px;background:linear-gradient(115deg,#142f55 0%,#245b91 58%,#347eae 100%);color:#fff;box-shadow:0 4px 12px rgba(20,47,85,.18)}
.nfa-hero-main{min-width:0}.nfa-brandline{font-size:10px;letter-spacing:1.35px;font-weight:700;text-transform:uppercase;color:#d9eaff;margin-bottom:7px}
.nfa-hero-title{font-size:24px;line-height:1.12;font-weight:800;letter-spacing:.35px;color:#fff}
.nfa-hero-sub{font-size:11px;color:#e6f1ff;margin-top:6px}
.nfa-hero-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:245px}
.nfa-meta-chip{padding:7px 10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);border-radius:7px;min-width:110px}
.nfa-meta-chip span{display:block;font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:#dbeafe;margin-bottom:3px}
.nfa-meta-chip b{font-size:12px;color:#fff;overflow-wrap:anywhere}
.nfa-status-chip{display:inline-block;padding:3px 8px;border-radius:20px;background:#fff;color:#173b63;font-size:9px;font-weight:800;letter-spacing:.45px}
.nfa-document h2{color:#173b63;border-bottom:2px solid #2f75a8;padding:0 0 7px;margin:4px 0 12px;font-size:15px}
.nfa-document h3{display:flex;align-items:center;gap:8px;color:#174b78;font-size:12px;font-weight:800;letter-spacing:.15px;text-transform:uppercase;margin:19px 0 8px;padding:7px 10px;background:linear-gradient(90deg,#eaf2fb,#f7faff);border-left:4px solid #2e75b6;border-radius:0 5px 5px 0;break-after:avoid}
.nfa-document table{border-collapse:separate;border-spacing:0;width:100%;font-size:10px;margin:5px 0 10px;overflow:hidden;border:1px solid #cbd7e5;border-radius:6px}
.nfa-document th{background:linear-gradient(180deg,#245b91,#183b68);color:#fff;border:1px solid #416d99;padding:7px 6px;font-size:9px;font-weight:700;line-height:1.25}
.nfa-document td{border:1px solid #d8e1eb;padding:6px 7px;line-height:1.35;vertical-align:top}
.nfa-document tbody tr:nth-child(even) td{background:#f7f9fc}
.nfa-document td.l{background:#eaf1f8!important;color:#24486e;font-weight:700}
.nfa-document td.g{background:#e7f5ec!important;color:#11613c;font-weight:800}
.nfa-document .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:10px 0 14px}
.nfa-document .kpi{border:1px solid #d6e1ed;border-top:3px solid #3478aa;border-radius:8px;padding:10px 11px;background:#f7faff;min-width:0}
.nfa-document .kpi:nth-child(2){border-top-color:#169b62;background:#f1fbf5}
.nfa-document .kpi:nth-child(3){border-top-color:#7c62bd;background:#f7f4ff}
.nfa-document .kpi:nth-child(4){border-top-color:#d18a2b;background:#fff8ed}
.nfa-document .kpi b{font-size:15px;line-height:1.3;overflow-wrap:anywhere;color:#173b63}
.nfa-document .kpi span{font-size:8px;line-height:1.3;letter-spacing:.55px}
.nfa-document .rec{background:linear-gradient(100deg,#eaf4ff,#f3f8ff);border:1px solid #c7dcf2;border-left:5px solid #2476b5;border-radius:7px;padding:12px 14px;margin:12px 0 16px;font-size:11px;line-height:1.5}
.nfa-document .note{font-size:9px;line-height:1.4;color:#52657b}
.nfa-check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin:8px 0 10px}
.nfa-check-item{min-width:0;border:1px solid #d9e2ec;border-left:4px solid #98a2b3;border-radius:6px;background:#fbfcfe;padding:8px 9px;break-inside:avoid;page-break-inside:avoid}
.nfa-check-item.pass{border-left-color:#15945b;background:#f3fbf6}
.nfa-check-item.fail{border-left-color:#d04444;background:#fff6f5}
.nfa-check-head{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:7px;align-items:start}
.nfa-check-no{display:flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:#e5edf6;color:#244b72;font-size:9px;font-weight:800}
.nfa-check-item.pass .nfa-check-no{background:#d5f1e0;color:#11613c}

 /* ---------- PRICE sheet ---------- */
 function priceSheet(Md,name){const n=Md.vend.length,lc=5+2*n,sh=wb.sheet(name,{tab:"0EA5E9",freeze:[8,3],cols:[5,18,40,7,9,...Md.vend.flatMap(()=>[14,16]),16,24],footer:name});

 function scoreSheet(Md,name,pr){const n=Md.vend.length,sh=wb.sheet(name,{tab:"7C3AED",freeze:[6,3],cols:[38,10,44,...Md.vend.map(()=>20)],footer:name});

  sh.merge(3,0,3,2+n,"Change the yellow weights to match your evaluation policy – points, totals and ranks recalculate. Weights should add up to 100.",X(st.mut,{wrap:true}));sh.h(3,28);
  ["Parameter","Weight","How points are given"].forEach((h,i)=>sh.set(5,i,h,st.h));Md.vend.forEach((V,k)=>sh.set(5,3+k,V.name,st.vh));sh.h(5,32);
  sh.merge(6,0,6,2+n,"A. Values taken from the quotations",X(st.lab,{color:K.acc}));
  const rules={price:"L1 price index from the Price sheet (1.000 = lowest landed)",del:"Shortest delivery gets full points; others in proportion",adv:"Lowest advance gets full points; (100 − adv) relative to best",warr:"Longest warranty gets full points; others in proportion",valid:"Longest validity gets full points; others in proportion",ld:"Highest LD cap gets full points; others in proportion",pbg:"Highest PBG % gets full points; others in proportion"};
  const units={price:"index",del:"days",adv:"%",warr:"months",valid:"days",ld:"% cap",pbg:"%"};
  const vr0=7,pr0=vr0+Md.scores.length+1;
  Md.scores.forEach((s,i)=>{const r=vr0+i;sh.set(r,0,{price:"Price index (item-wise L1 ÷ vendor landed)",del:"Delivery period (days)",adv:"Advance (%)",warr:"Warranty (months)",valid:"Offer validity (days)",ld:"LD cap (%)",pbg:"Performance BG (%)"}[s.key],st.lab);sh.set(r,1,"",st.lab);sh.set(r,2,rules[s.key],X(st.td,{sz:9,color:K.mut}));
   Md.vend.forEach((V,k)=>{if(s.key==="price")sh.f(r,3+k,pr.idx[k],X(st.n4));else sh.set(r,3+k,s.vals[k]??"",X(s.key==="price"?st.n4:st.n1,st.inp))})});
  sh.merge(pr0-1,0,pr0-1,2+n,"B. Points (out of the weight)",X(st.lab,{color:K.acc}));
  Md.scores.forEach((s,i)=>{const r=pr0+i,vr=vr0+i,w=A(r,1),rng=`${A(vr,3)}:${A(vr,2+n)}`;sh.set(r,0,s.lab,st.lab);sh.set(r,1,s.w,X(st.n0,st.inp,{h:"center",b:1}));sh.set(r,2,"Weight × relative performance",X(st.td,{sz:9,color:K.mut}));
   Md.vend.forEach((V,k)=>{const v=R(vr,3+k);const f=s.key==="price"?`IF(${v}="",0,${w}*${v})`:s.key==="del"?`IF(OR(${v}="",${v}<=0),0,IF(MIN(${rng})<=0,0,${w}*MIN(${rng})/${v}))`:s.key==="adv"?`IF(${v}="",0,IF(MIN(${rng})>=100,0,${w}*(100-${v})/(100-MIN(${rng}))))`:`IF(OR(${v}="",MAX(${rng})<=0),0,${w}*${v}/MAX(${rng}))`;sh.f(r,3+k,f,st.n1)})});
  const tr=pr0+Md.scores.length;sh.set(tr,0,"TOTAL COMMERCIAL SCORE (out of 100)",X(st.hl));sh.f(tr,1,`SUM(${R(pr0,1)}:${R(tr-1,1)})`,X(st.n0,st.hl,{h:"center"}));sh.set(tr,2,"",st.hl);
  Md.vend.forEach((V,k)=>{sh.f(tr,3+k,`SUM(${R(pr0,3+k)}:${R(tr-1,3+k)})`,X(st.n1,{b:1,sz:11,fill:K.accS}));sh.f(tr+1,3+k,`RANK(${R(tr,3+k)},${A(tr,3)}:${A(tr,2+n)})`,X(st.n0,{h:"center",b:1}))});
  sh.set(tr+1,0,"Rank",st.lab);sh.set(tr+1,1,"",st.lab);sh.set(tr+1,2,"",st.lab);sh.h(tr,22);
  sh.merge(tr+3,0,tr+3,2+n,"The score is a commercial decision aid only. The award follows the Comparative Statement after technical evaluation, negotiation and DoA approval.",st.mut);
  const nm=`${qs(sh.name)}!${A(5,3)}:${A(5,2+n)}`,tot=`${qs(sh.name)}!${A(tr,3)}:${A(tr,2+n)}`;
  return{names:nm,totals:tot,tot:Md.vend.map((V,k)=>qs(sh.name)+"!"+A(tr,3+k)),rank:Md.vend.map((V,k)=>qs(sh.name)+"!"+A(tr+1,3+k))}}

 function termsSheet(Md,name,pr,sc){const n=Md.vend.length,sh=wb.sheet(name,{tab:"0F766E",freeze:[4,2],cols:[5,32,...Md.vend.map(()=>26),24,54],footer:name});
  head(sh,4+n,`Terms & conditions – ${LBL[Md.src]} – vendor comparison`);
  ["#","Term / condition",...Md.vend.map(V=>V.name),"Best in this RFQ","Observation / suggestion"].forEach((h,i)=>sh.set(3,i,h,i>=2&&i<2+n?st.vh:st.h));sh.h(3,32);
  const vb=Md.vend.filter(V=>V.complete).sort((a,b)=>a.landed-b.landed);
  const top=[["Items quoted",k=>Md.vend[k].items+" of "+Md.items.length,null],["Landed value ("+base+")",k=>null,"landed"],["Commercial score (/100)",k=>null,"score"]];
  top.forEach(([l,fn,kind],i)=>{const r=4+i;sh.set(r,0,"",st.lab);sh.set(r,1,l,X(st.lab,{color:K.acc}));
   Md.vend.forEach((V,k)=>{const fill=kind==="landed"?(vb[0]===V?st.best:vb.length>1&&vb[vb.length-1]===V?st.worst:{}):kind==="score"?(V.rank===1?st.best:V.rank===n&&n>1?st.worst:{}):(!V.complete?st.flag:{});
    if(kind==="landed")sh.f(r,2+k,pr.landed[k],X(st.n0,fill,{b:1}));else if(kind==="score")sh.f(r,2+k,sc.tot[k],X(st.n1,fill,{b:1}));else sh.set(r,2+k,fn(k),X(fill,{h:"center"}))});
   sh.set(r,2+n,kind==="landed"?(vb[0]?.name||"—"):kind==="score"?(Md.best?.name||"—"):"",X(st.td,{b:1}));sh.set(r,3+n,kind==="landed"?"Lowest landed value among vendors who quoted every item (excl. GST)":kind==="score"?"Weighted score – see Scoring sheet":"",X(st.td,{sz:9}))});
  Md.rows.forEach((row,i)=>{const r=7+i,flags=[];sh.set(r,0,i+1,X(st.td,{h:"center"}));sh.set(r,1,row.lab+(row.k==="LF"?" (calculated)":""),st.lab);
   Md.vend.forEach((V,k)=>{const fl=termFlag(row.k,V.t);if(fl)flags.push(V.name);const v=qtDisp(row.k,V.t);sh.set(r,2+k,v===""?"not stated":v,X(fillOf(row.ev,V.j,fl),v===""?{i:1,color:K.mut}:{}))});
   const bestN=row.ev.diff?"Differs – compare":row.ev.equal?(Md.vend.some(V=>qtHas(V.t[row.k])||row.k==="LF")?"Equal for all":"—"):row.ev.best.map(j=>Md.vend.find(V=>V.j===j).name).join(", ");
   sh.set(r,2+n,bestN,X(row.ev.best.length&&!row.ev.equal?st.best:{}));
   sh.set(r,3+n,[row.ev.note,flags.length?"⚠ Review: "+flags.join(", "):""].filter(Boolean).join(" · "),X(st.td,{sz:9}))});
  const lg=7+Md.rows.length+1;sh.set(lg,1,"Legend",X(st.lab));[["Best in this RFQ",st.best],["Weakest in this RFQ",st.worst],["Risk – review before award",st.flag],["Differs – verify (e.g. GST rate)",st.info]].forEach(([t,s],i)=>sh.set(lg+1+i,1,t,s));
  return sh}

function invalidateForPath(path){
 if(!path)return;
 const root=path.split(".")[0],parts=path.split(".");
 if(root==="project"){invalidateWorkflow("proj");return}
 if(root==="header"){invalidateWorkflow("hdr");return}
 if(root==="vendors"){
  if(parts[2]==="techEval"){invalidateWorkflow("tech");return}
  if(parts[2]==="qterms"){invalidateWorkflow("qtc");return}
  if(parts[2]==="terms"&&FX_KEYS.includes(parts[3])){invalidateWorkflow("quo");return}
  if(parts[2]==="terms"){const vv=D().vendors[Number(parts[1])];if(vv)vv.termsNeg=true}
  if(parts[2]==="terms"){invalidateWorkflow("trm");return}
  invalidateWorkflow("quo");return;
 }
 if(root==="items"){
  if(parts[2]==="lpp"){invalidateWorkflow("cs");return}
  if(parts[2]==="r"&&parts[4]==="q"){invalidateWorkflow("quo");return}
  if(parts[2]==="r"&&parts[4]==="n"){invalidateWorkflow("trm");return}
  invalidateWorkflow("quo");return;
 }
 if(root==="nfa"){if(parts[1]==="ov"||parts[1]==="ovr"||parts[1]==="lppJ"){invalidateWorkflow("cs");return}invalidateWorkflow("nfa");return}
 if(root==="techMode")invalidateWorkflow("tech");
}

// Persist editable text / numeric fields as the user types, without re-rendering.
// This prevents the focused field from being replaced during blur when the Buyer
// clicks a Submit button. Re-rendering is reserved for select controls and actions.
function persistFieldChange(el){
 const p=el?.dataset?.p;
 if(!p||!canEdit(p))return;
 const z=p.split("."),v=el.value,previous=getP(p);
 const nv=el.type==="number"?(v===""?"":Number(v)):v;
 if(String(previous??"")===String(nv??""))return false;
 if(z[0]==="nfa"&&z[1]==="ov"&&String(previous??"")!==String(v??""))setP("nfa.ovr."+z[2],"");
 if(/^items\.\d+\.r\.\d+\.n$/.test(p)){
  const vendor=D().vendors[Number(z[3])];
  if(!isOkForLine(vendor,Number(z[1])))return;
 }
 setP(p,nv);
 if(z[0]==="vendors"&&z[2]==="terms"&&z[3]==="cur"){const t=D().vendors[Number(z[1])].terms,base=D().header.cur;
  if(nv===base){t.fxRate=1;t.fxDate="";t.fxSource="Not applicable – base currency"}else{if(Number(t.fxRate)===1)t.fxRate="";if(/^Not applicable/.test(t.fxSource||""))t.fxSource=""}
  audit("Quote currency for "+(D().vendors[Number(z[1])].name||"Vendor "+(Number(z[1])+1))+" set to "+(nv||"—"));}
 invalidateForPath(p);
 if(z[0]==="vendors"&&z[2]==="techEval"){
  const j=Number(z[1]),vd=D().vendors[j];
  if(vd&&vd.techEval){
   if(vd.techEval.legacy&&z[3]!=="legacy")delete vd.techEval.legacy;
   vd.techEval.submitted=false;delete vd.techEval.submittedOn;
   if(z[3]==="lines"&&z[4]!=null&&vd.techEval.lines?.[z[4]]){vd.techEval.lines[z[4]].submitted=false;delete vd.techEval.lines[z[4]].submittedOn;}
  }
  if(z[3]==="status")audit("Technical outcome for "+(vd.name||"Vendor "+(j+1))+": "+(v||"cleared"));
 }
 save();return true;
}
